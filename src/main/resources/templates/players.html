<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Players | Vision Sports Academy</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="app"><aside><div class="side-brand"><div class="brand-mark">VSA</div><div><b>Vision Sports</b><small>Academy</small></div></div><nav><a href="/dashboard">Dashboard</a><a class="active" href="/players">Players</a><a href="/parents">Parents / Guardians</a><a href="/coaches">Coaches</a></nav><button id="logout" class="logout">Logout</button></aside><main><header><div><span class="eyebrow">MEMBER 1 · FR1.1 / FR1.6</span><h1>Player Management</h1><p>Create, view, update, delete and search player profiles.</p></div></header><section class="panel"><div class="toolbar"><input id="search" placeholder="Search by name, ID or age group"><button class="primary" onclick="loadPlayers()">Search</button><button class="secondary" onclick="openForm()">+ Register Player</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Age Group</th><th>Kit</th><th>Parent</th><th>Status</th><th>Actions</th></tr></thead><tbody id="playerRows"></tbody></table></div></section></main></div><div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Register Player</h2><button onclick="closeForm()">×</button></div><form id="playerForm"><input type="hidden" id="id"><div class="form-grid"><div><label>Full Name *</label><input id="fullName" required></div><div><label>Date of Birth</label><input id="dateOfBirth" type="date"></div><div><label>Age Group *</label><select id="ageGroup" required><option>Under-08</option><option>Under-10</option><option>Under-12</option><option>Under-14</option><option>Under-16</option><option>Under-18</option></select></div><div><label>Kit Size</label><select id="kitSize"><option>S</option><option>M</option><option>L</option><option>XL</option></select></div><div class="wide"><label>Medical Information</label><textarea id="medicalInformation" rows="2"></textarea></div><div><label>Parent / Guardian</label><select id="parentId"><option value="">Not linked</option></select></div><div><label>Account Status</label><select id="status"><option>ACTIVE</option><option>INACTIVE</option><option>SUSPENDED</option></select></div></div><div id="accountFields" class="account-fields"><h3>Optional login account</h3><div class="form-grid"><div><label>Username</label><input id="username"></div><div><label>Password</label><input id="password" type="password" placeholder="player123"></div></div></div><div class="form-actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary" type="submit">Save Player</button></div></form></div></div><script src="/js/common.js"></script><script src="/js/players.js"></script></body></html>
