<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Sports Academy - Training Sessions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .add-button {
            grid-column: span 2;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }


        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏟️ Training Sessions</h1>

    <form id="sessionForm">

        <input type="text" id="coach" placeholder="Coach Name" required>

        <input type="text" id="ground" placeholder="Ground" required>

        <input type="text" id="playerGroup" placeholder="Player Group" required>

        <input type="date" id="sessionDate" required>

        <input type="time" id="startTime" required>

        <input type="time" id="endTime" required>

        <button class="add-button" type="submit">
            + Add Training Session
        </button>

    </form>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Coach</th>
                <th>Ground</th>
                <th>Player Group</th>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="sessionTable"></tbody>

    </table>

</div>

<script>

    const apiUrl = "/api/training-sessions";

    function loadSessions() {

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {

                const table = document.getElementById("sessionTable");

                table.innerHTML = "";

                data.forEach(session => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${session.id}</td>
                        <td>${session.coach}</td>
                        <td>${session.ground}</td>
                        <td>${session.playerGroup}</td>
                        <td>${session.sessionDate}</td>
                        <td>${session.startTime}</td>
                        <td>${session.endTime}</td>
                        <td>
                            <button class="delete-btn"
                                onclick="deleteSession(${session.id})">
                                Delete
                            </button>
                        </td>
                    `;

                    table.appendChild(row);
                });

            });
    }


    document.getElementById("sessionForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const session = {

            coach: document.getElementById("coach").value,

            ground: document.getElementById("ground").value,

            playerGroup: document.getElementById("playerGroup").value,

            sessionDate: document.getElementById("sessionDate").value,

            startTime: document.getElementById("startTime").value,

            endTime: document.getElementById("endTime").value

        };

        fetch(apiUrl, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(session)

        })
        .then(response => response.json())
        .then(() => {

            document.getElementById("sessionForm").reset();

            loadSessions();

        });

    });


    function deleteSession(id) {

        if (!confirm("Are you sure you want to delete this session?")) {
            return;
        }

        fetch(apiUrl + "/" + id, {

            method: "DELETE"

        })
        .then(() => {

            loadSessions();

        });

    }


    loadSessions();

</script>

</body>
</html>
