<meta charset="UTF-8">

<meta name="viewport"

<title>Attendance Report</title>

<style>

    * {

        margin: 0;

        border-radius: 16px;

        gap: 15px;

            0 5px 20px

        width: 100%;

        background: white;
        border-radius: 16px;

        box-shadow:
            0 5px 20px

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #f3f4f6;
        padding: 15px;
        text-align: left;

    }

    .good {

    }

    .medium {

    }

    .low {

    }

        padding: 40px;

    }

    @media (max-width: 800px) {

        .stats {

</style>

</head>

<body>

<div class="container">

</div>

<script>

    const playerApiUrl =
        "/api/players";

    const attendanceApiUrl =
        "/api/attendance";


    let players = [];

    let attendanceRecords = [];


    /*
     * LOAD DATA
     */

    async function loadData() {

        try {

            const playerResponse =
                await fetch(playerApiUrl);

            const attendanceResponse =
                await fetch(attendanceApiUrl);


            if (!playerResponse.ok ||
                !attendanceResponse.ok) {

                throw new Error(
                    "Unable to load data."
                );

            }


            players =
                await playerResponse.json();

            attendanceRecords =
                await attendanceResponse.json();


            updateReport();

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "reportTable"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="empty">

                        Unable to load attendance data.

                    </td>

                </tr>

            `;

        }

    }


    /*
     * CREATE REPORT
     */

    function updateReport() {

        const search =
            document
                .getElementById(
                    "searchPlayer"
                )
                .value
                .toLowerCase()
                .trim();


        const selectedGroup =
            document
                .getElementById(
                    "groupFilter"
                )
                .value;


        let filteredPlayers =
            players.filter(player => {

                const matchesSearch =
                    !search ||
                    String(player.id)
                        .includes(search) ||
                    player.name
                        .toLowerCase()
                        .includes(search);


                const matchesGroup =
                    !selectedGroup ||
                    player.playerGroup ===
                    selectedGroup;


                return matchesSearch &&
                       matchesGroup;

            });


        displayReport(filteredPlayers);

        updateStatistics();

    }


    /*
     * DISPLAY REPORT
     */

    function displayReport(playerList) {

        const table =
            document.getElementById(
                "reportTable"
            );


        table.innerHTML = "";


        if (playerList.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="empty">

                        No players found.

                    </td>

                </tr>

            `;

            return;

        }


        playerList.forEach(player => {

            const records =
                attendanceRecords.filter(
                    record =>
                        Number(
                            record.playerId
                        ) === Number(
                            player.id
                        )
                );


            const total =
                records.length;


            const present =
                records.filter(
                    record =>
                        record.status ===
                        "PRESENT"
                ).length;


            const absent =
                records.filter(
                    record =>
                        record.status ===
                        "ABSENT"
                ).length;


            const late =
                records.filter(
                    record =>
                        record.status ===
                        "LATE"
                ).length;


            const excused =
                records.filter(
                    record =>
                        record.status ===
                        "EXCUSED"
                ).length;


            /*
             * PRESENT + LATE
             * COUNT AS ATTENDED
             */

            const attended =
                present + late;


            /*
             * ATTENDANCE PERCENTAGE
             */

            const percentage =
                total > 0
                    ? (
                        attended /
                        total *
                        100
                    ).toFixed(1)
                    : "0.0";


            let percentageClass =
                "low";


            if (Number(percentage) >= 80) {

                percentageClass =
                    "good";

            }
            else if (Number(percentage) >= 60) {

                percentageClass =
                    "medium";

            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${player.id}
                </td>

                <td>
                    ${player.name}
                </td>

                <td>
                    ${player.playerGroup}
                </td>

                <td>
                    ${total}
                </td>

                <td>
                    ${present}
                </td>

                <td>
                    ${absent}
                </td>

                <td>
                    ${late}
                </td>

                <td>
                    ${excused}
                </td>

                <td
                    class="percentage
                           ${percentageClass}">

                    ${percentage}%

                </td>

            `;


            table.appendChild(row);

        });

    }


    /*
     * STATISTICS
     */

    function updateStatistics() {

        document.getElementById(
            "totalPlayers"
        ).textContent =
            players.length;


        document.getElementById(
            "totalRecords"
        ).textContent =
            attendanceRecords.length;


        /*
         * PRESENT + LATE
         * COUNT AS ATTENDED
         */

        const present =
            attendanceRecords.filter(
                record =>
                    record.status ===
                    "PRESENT"
            ).length;


        const late =
            attendanceRecords.filter(
                record =>
                    record.status ===
                    "LATE"
            ).length;


        const attended =
            present + late;


        const total =
            attendanceRecords.length;


        const percentage =
            total > 0
                ? (
                    attended /
                    total *
                    100
                ).toFixed(1)
                : "0.0";


        document.getElementById(
            "overallPercentage"
        ).textContent =
            percentage + "%";

    }


    /*
     * FILTER EVENTS
     */

    document
        .getElementById(
            "searchPlayer"
        )
        .addEventListener(
            "input",
            updateReport
        );


    document
        .getElementById(
            "groupFilter"
        )
        .addEventListener(
            "change",
            updateReport
        );


    /*
     * START
     */

    document.addEventListener(
        "DOMContentLoaded",
        loadData
    );

</script>

</body>

</html>
