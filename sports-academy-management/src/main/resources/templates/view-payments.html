<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Payments - Vision Sports Academy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
        h2 { border-bottom: 2px solid #0056b3; padding-bottom: 10px; color: #0056b3; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; font-weight: bold; }
        tr:hover { background-color: #f5f5f5; }
        .PENDING { color: #f39c12; font-weight: bold; }
        .PAID { color: #27ae60; font-weight: bold; }
        .OVERDUE { color: #c0392b; font-weight: bold; }
        .error-msg { color: #c0392b; background: #fadbd8; padding: 10px; border: 1px solid #c0392b; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>Payment History</h2>
    
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <table>
        <thead>
            <tr>
                <th>Payment ID</th>
                <th>Player ID</th>
                <th>Amount (Rs.)</th>
                <th>Due Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.paymentId}">1</td>
                <td th:text="${payment.playerId}">1024</td>
                <td th:text="${payment.amount}">2500.00</td>
                <td th:text="${payment.dueDate}">2026-10-01</td>
                <td th:text="${payment.status}" th:class="${payment.status}">PENDING</td>
            </tr>
            <tr th:if="${payments != null and #lists.isEmpty(payments)}">
                <td colspan="5" style="text-align: center;">No payment records found.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
