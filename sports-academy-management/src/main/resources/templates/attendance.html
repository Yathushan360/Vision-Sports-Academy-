<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vision Academy - Attendance</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        /* Top Header */

        .header {
            background: #111827;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #22c55e;
        }

        .header-text {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Main Container */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
        }

        /* Session Card */

        .session-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .session-card h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            color: #475569;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #22c55e;
        }

        /* Attendance Header */

        .attendance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .attendance-header h2 {
            font-size: 22px;
        }

        .date-text {
            background: #ecfdf5;
            color: #15803d;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Player Card */

        .player-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            transition: 0.2s;
        }

        .player-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #111827;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
        }

        .player-name {
            font-weight: bold;
            font-size: 16px;
        }

        .player-id {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 3px;
        }

        /* Status Buttons */

        .status-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-btn {
            border: 1px solid #dbe2ea;
            background: white;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        .status-btn:hover {
            transform: translateY(-1px);
        }

        .present-btn:hover,
        .present-btn.active {
            background: #dcfce7;
            color: #15803d;
            border-color: #22c55e;
        }

        .absent-btn:hover,
        .absent-btn.active {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #ef4444;
        }

        .late-btn:hover,
        .late-btn.active {
            background: #ffedd5;
            color: #c2410c;
            border-color: #f97316;
        }

        .excused-btn:hover,
        .excused-btn.active {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #3b82f6;
        }

        /* Submit Button */

        .submit-area {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .save-btn {
            background: #22c55e;
            border: none;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-btn:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }

        /* Summary */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .summary-card h3 {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .summary-card p {
            font-size: 26px;
            font-weight: bold;
        }

        .green {
            color: #16a34a;
        }

        .red {
            color: #dc2626;
        }

        .orange {
            color: #ea580c;
        }

        .blue {
            color: #2563eb;
        }

        /* Mobile */

        @media (max-width: 800px) {

            .header {
                padding: 15px 20px;
            }

            .container {
                width: 94%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .summary {
                grid-template-columns: 1fr 1fr;
            }

            .player-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .status-buttons {
                width: 100%;
            }

            .status-btn {
                flex: 1;
            }
        }

    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        Vision<span>Academy</span>
    </div>

    <div class="header-text">
        Training & Attendance
    </div>

</header>


<main class="container">

    <div class="page-title">
        <h1>⚽ Attendance</h1>
        <p>Mark player attendance for today's training session.</p>
    </div>


    <!-- Session Details -->

    <div class="session-card">

        <h2>Training Session</h2>

        <div class="form-row">

            <div class="form-group">
                <label>Session ID</label>
                <input type="number" id="sessionId" placeholder="Enter session ID">
            </div>

            <div class="form-group">
                <label>Player ID</label>
                <input type="number" id="playerId" placeholder="Enter player ID">
            </div>

        </div>

    </div>


    <!-- Summary -->

    <div class="summary">

        <div class="summary-card">
            <h3>Present</h3>
            <p class="green" id="presentCount">0</p>
        </div>

        <div class="summary-card">
            <h3>Absent</h3>
            <p class="red" id="absentCount">0</p>
        </div>

        <div class="summary-card">
            <h3>Late</h3>
            <p class="orange" id="lateCount">0</p>
        </div>

        <div class="summary-card">
            <h3>Excused</h3>
            <p class="blue" id="excusedCount">0</p>
        </div>

    </div>


    <!-- Attendance -->

    <div class="session-card">

        <div class="attendance-header">

            <div>
                <h2>Player Attendance</h2>
            </div>

            <div class="date-text" id="todayDate">
                Today
            </div>

        </div>


        <div class="player-card">

            <div class="player-info">

                <div class="player-avatar">
                    P1
                </div>

                <div>
                    <div class="player-name">
                        Player 01
                    </div>

                    <div class="player-id">
                        Player ID: 1
                    </div>
                </div>

            </div>


            <div class="status-buttons">

                <button
                    class="status-btn present-btn"
                    onclick="selectStatus(this, 'PRESENT')">
                    ✓ Present
                </button>

                <button
                    class="status-btn absent-btn"
                    onclick="selectStatus(this, 'ABSENT')">
                    ✕ Absent
                </button>

                <button
                    class="status-btn late-btn"
                    onclick="selectStatus(this, 'LATE')">
                    ⏱ Late
                </button>

                <button
                    class="status-btn excused-btn"
                    onclick="selectStatus(this, 'EXCUSED')">
                    ★ Excused
                </button>

            </div>

        </div>


        <div class="submit-area">

            <button class="save-btn" onclick="saveAttendance()">
                Save Attendance
            </button>

        </div>

    </div>

</main>


<script>

    let selectedStatus = "";


    function selectStatus(button, status) {

        let buttons = document.querySelectorAll(".status-btn");

        buttons.forEach(function(btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedStatus = status;

        updateSummary();
    }


    function updateSummary() {

        document.getElementById("presentCount").textContent =
            selectedStatus === "PRESENT" ? "1" : "0";

        document.getElementById("absentCount").textContent =
            selectedStatus === "ABSENT" ? "1" : "0";

        document.getElementById("lateCount").textContent =
            selectedStatus === "LATE" ? "1" : "0";

        document.getElementById("excusedCount").textContent =
            selectedStatus === "EXCUSED" ? "1" : "0";
    }


    async function saveAttendance() {

        let sessionId =
            document.getElementById("sessionId").value;

        let playerId =
            document.getElementById("playerId").value;


        if (sessionId === "" || playerId === "") {

            alert("Please enter Session ID and Player ID.");

            return;
        }


        if (selectedStatus === "") {

            alert("Please select an attendance status.");

            return;
        }


        let attendance = {

            sessionId: Number(sessionId),

            playerId: Number(playerId),

            status: selectedStatus,

            remarks: "",

            markedBy: "Coach"

        };


        try {

            let response = await fetch("/api/attendance", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(attendance)

            });


            if (response.ok) {

                alert("Attendance saved successfully!");

                document.getElementById("sessionId").value = "";
                document.getElementById("playerId").value = "";

                selectedStatus = "";

                document.querySelectorAll(".status-btn")
                    .forEach(function(btn) {
                        btn.classList.remove("active");
                    });

                updateSummary();

            } else {

                alert("Something went wrong while saving attendance.");

            }

        } catch (error) {

            console.log(error);

            alert("Could not connect to the server.");

        }

    }


    // Show current date

    let today = new Date();

    document.getElementById("todayDate").textContent =
        today.toLocaleDateString();

</script>

</body>
</html>
